[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield-local"
version = "0.1.0"
description = "Lightweight, explainable prompt injection detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools.packages.find]
include = ["promptshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
